<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">jev-router — Hermes × TypeSafe Jev model routing</title>
  <desc id="desc">Hero showing model routing labels and trim-then-compress context engine for Hermes Agent.</desc>
  <rect width="1200" height="380" rx="28" fill="#0A0C10"/>
  <rect x="0" y="0" width="8" height="380" fill="#7CFFB2"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans SC', sans-serif">
    <text x="56" y="72" fill="#9AA3B2" font-size="16" letter-spacing="2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">HERMES PLUGIN · MIT</text>
    <text x="56" y="140" fill="#F2F4F7" font-size="56" font-weight="700">jev-router</text>
    <text x="56" y="186" fill="#C8CED8" font-size="22">TypeSafe Jev 选模型 · 先 trim 再 compress</text>
    <text x="56" y="222" fill="#9AA3B2" font-size="18">简单走便宜，复杂／工具重／长上下文走更强；失败回退主模型</text>
    <g transform="translate(56 260)">
      <rect width="160" height="34" rx="8" fill="#12151C" stroke="#2A303C"/>
      <text x="80" y="22" text-anchor="middle" fill="#7CFFB2" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">TYPESAFE ONLY</text>
      <rect x="172" width="150" height="34" rx="8" fill="#12151C" stroke="#2A303C"/>
      <text x="247" y="22" text-anchor="middle" fill="#6EA8FE" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">trim → compress</text>
      <rect x="334" width="120" height="34" rx="8" fill="#12151C" stroke="#2A303C"/>
      <text x="394" y="22" text-anchor="middle" fill="#9AA3B2" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">no Gateway</text>
    </g>
  </g>

  <!-- routing board -->
  <g transform="translate(700 56)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect width="444" height="268" rx="16" fill="#12151C" stroke="#2A303C"/>
    <text x="24" y="36" fill="#9AA3B2" font-size="13">pre_llm_call → Jev Choice</text>
    <g transform="translate(24 56)">
      <rect width="180" height="44" rx="10" fill="#0A0C10" stroke="#7CFFB2"/>
      <text x="16" y="28" fill="#7CFFB2" font-size="15">cheap</text>
      <text x="100" y="28" fill="#9AA3B2" font-size="12">deepseek-flash</text>
    </g>
    <g transform="translate(24 112)">
      <rect width="180" height="44" rx="10" fill="#0A0C10" stroke="#6EA8FE"/>
      <text x="16" y="28" fill="#6EA8FE" font-size="15">primary</text>
      <text x="100" y="28" fill="#9AA3B2" font-size="12">fallback</text>
    </g>
    <g transform="translate(24 168)">
      <rect width="180" height="44" rx="10" fill="#0A0C10" stroke="#F2F4F7"/>
      <text x="16" y="28" fill="#F2F4F7" font-size="15">complex</text>
      <text x="100" y="28" fill="#9AA3B2" font-size="12">deepseek-chat</text>
    </g>
    <path d="M230 78 L280 78 L280 190 L230 190" fill="none" stroke="#2A303C" stroke-width="2"/>
    <path d="M280 134 L320 134" stroke="#7CFFB2" stroke-width="2"/>
    <g transform="translate(328 100)">
      <rect width="92" height="68" rx="10" fill="#0A0C10" stroke="#7CFFB2"/>
      <text x="46" y="30" text-anchor="middle" fill="#F2F4F7" font-size="13">model</text>
      <text x="46" y="50" text-anchor="middle" fill="#7CFFB2" font-size="12">rewrite</text>
    </g>
    <text x="24" y="244" fill="#9AA3B2" font-size="12">low confidence / timeout → primary</text>
  </g>
</svg>
