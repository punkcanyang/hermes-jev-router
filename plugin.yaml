name: jev-router
version: 0.1.0
manifest_version: 2
api_version: 1
description: "Jev（TypeSafe 直连）模型路由 + 强制先 trim 再 compress"
author: "Punkcan / AuraElement studio"
license: MIT
tags: [routing, compression, jev, typesafe]
provides_hooks:
  - pre_llm_call
  - pre_auxiliary_call
  - post_auxiliary_call
requires_env:
  - name: TYPESAFE_API_KEY
    description: "TypeSafe API key（Jev 直连；禁止 Vercel AI Gateway）"
    secret: true
config_schema:
  routing_enabled: {type: bool, default: true, description: "开／关 Jev 模型路由（亦可用 JEV_ROUTER_ROUTING_ENABLED=false）"}
  trim_enabled: {type: bool, default: true, description: "开／关裁剪（亦可用 JEV_ROUTER_TRIM_ENABLED=false）"}
  min_confidence: {type: float, default: 0.55, description: "低于此置信度回退主模型"}
  timeout_seconds: {type: float, default: 8.0, description: "Jev 调用超时（秒）"}
  primary_model: {type: str, default: "deepseek-flash", description: "主模型（兜底）"}
  cheap_model: {type: str, default: "deepseek-flash", description: "简单任务模型"}
  complex_model: {type: str, default: "deepseek-chat", description: "复杂任务模型"}
  tool_heavy_model: {type: str, default: "deepseek-chat", description: "工具重任务模型"}
  long_context_model: {type: str, default: "deepseek-chat", description: "长上下文模型"}
  keep_last_n_turns: {type: int, default: 6, description: "trim 保留最近 N 轮"}
  drop_old_tool_noise: {type: bool, default: true, description: "丢弃过旧工具噪声"}
